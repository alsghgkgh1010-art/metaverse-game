# 푸시할 때마다 두 게임이 교실에서 안전하게 돌아가는지 자동으로 검사한다.
# 손으로 확인하던 것(문법·금지 API·외부 요청·지도 길찾기)을 대신한다.
name: 게임 검사

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:        # Actions 탭에서 단추로 직접 실행할 수 있다

jobs:
  verify:
    name: 배포 전 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 게임 파일 검사
        run: node tools/check.mjs

  shots:
    name: 화면 촬영
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: 한글 글꼴 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 두 게임 화면 촬영
        run: |
          mkdir -p 화면
          shot () {   # $1=결과파일  $2=주소
            google-chrome --headless=new --disable-gpu --enable-unsafe-swiftshader \
              --window-size=1280,860 --virtual-time-budget=9000 --hide-scrollbars \
              --screenshot="화면/$1" "$2"
          }
          BASE="file://$PWD"
          shot 퀴즈맵-시작.png   "$BASE/조선시대-퀴즈맵.html"
          shot 우주-시작.png     "$BASE/우주탐사-RPG.html"
          shot 우주-지구.png     "$BASE/우주탐사-RPG.html?start=1"
          shot 우주-달.png       "$BASE/우주탐사-RPG.html?start=1&body=moon"
          ls -l 화면

      - name: 화면 올리기
        uses: actions/upload-artifact@v4
        with:
          name: 게임-화면
          path: 화면/
          retention-days: 14
